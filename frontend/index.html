<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Recruitment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .hover-shadow:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08) !important;
        }
        .transition-all {
            transition: all 0.25s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                <router-link to="/" class="navbar-brand text-primary">
                    <i class="bi bi-mortarboard-fill me-2"></i>PlacementPortal
                </router-link>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <router-link to="/" class="nav-link">Home</router-link>
                        </li>
                        
                        <li class="nav-item" v-if="isLoggedIn && userRole === 'admin'">
                            <router-link to="/admin-dashboard" class="nav-link text-warning fw-bold">Admin Panel</router-link>
                        </li>
                        <li class="nav-item" v-if="isLoggedIn && userRole === 'company'">
                            <router-link to="/company-dashboard" class="nav-link text-success fw-bold">Corporate Console</router-link>
                        </li>
                        <li class="nav-item" v-if="isLoggedIn && userRole === 'student'">
                            <router-link to="/student-dashboard" class="nav-link text-info fw-bold">Student Hub</router-link>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-2">
                        <template v-if="!isLoggedIn">
                            <router-link to="/login" class="btn btn-sm btn-outline-light px-3">Sign In</router-link>
                            <router-link to="/register" class="btn btn-sm btn-primary px-3">Register</router-link>
                        </template>
                        <template v-else>
                            <span class="text-light small me-2 text-uppercase font-monospace bg-secondary px-2 py-1 rounded">
                                Role: {{ userRole }}
                            </span>
                            <button class="btn btn-sm btn-danger px-3 fw-bold" @click="executeSessionTermination">
                                <i class="bi bi-box-arrow-right me-1"></i>Logout
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container">
            <router-view></router-view>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <script src="app.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
